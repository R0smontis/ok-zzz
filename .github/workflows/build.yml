# 发布流程，与 ok-ww 相同：推送 vX.Y.Z 标签后
# 测试 → 同步更新仓库（启动器从这里在线更新）→ 构建启动器与安装包 → 发布 Release。
# 手动运行（workflow_dispatch）只执行测试。
name: Windows Release
run-name: ${{ github.event_name == 'push' && format('Windows release · {0}', github.ref_name) || 'Validate' }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONUTF8: '1'
  UPDATE_REPO: 'git@github.com:R0smontis/ok-zzz-update.git'

jobs:
  validate:
    name: Run tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install ViGEmBus
        uses: ./.github/actions/install-vigembus

      - name: Install dependencies
        run: |
          python -m pip install --no-deps -r requirements.lock.txt
          python -m pip install -r requirements-dev.txt

      - name: Run offline tests
        run: python -m pytest -q -p no:cacheprovider --durations=15

  synchronize:
    name: Synchronize update repository
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      is_release: ${{ steps.release_version.outputs.is_release }}
      start_tag: ${{ steps.sync.outputs.start_tag }}
      end_tag: ${{ steps.sync.outputs.end_tag }}
      changes: ${{ steps.sync.outputs.changes_with_asterisk }}
    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global user.email "R0smontis@users.noreply.github.com"
          git config --global user.name "ok-zzz release"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 生成更新日志需要全部标签
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock.txt

      - name: Install ViGEmBus
        uses: ./.github/actions/install-vigembus

      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt

      - name: Prepare release requirements
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -m ok.update.inline_ok_requirements --tag "$env:RELEASE_TAG"

      - name: Check release version
        id: release_version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $isRelease = $env:RELEASE_TAG -match '^v?\d+\.\d+\.\d+$'
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Configure update repository key
        shell: bash
        env:
          UPDATE_REPO_SSH_KEY: ${{ secrets.UPDATE_REPO_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$UPDATE_REPO_SSH_KEY" > "$HOME/.ssh/update_repo_key"
          chmod 600 "$HOME/.ssh/update_repo_key"
          ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          git config --global core.sshCommand "ssh -i '$HOME/.ssh/update_repo_key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"

      - name: Synchronize update repository
        id: sync
        uses: ok-oldking/partial-sync-repo@c55d1e590ccab2a14669e9d5da291dde8ee282f3 # master 2026-10-18
        with:
          repos: ${{ env.UPDATE_REPO }}
          sync_list: 'deploy.txt'
          tag: ${{ github.ref_name }}
          gitignore_file: '.update_repo_gitignore'
          show_author: false

      - name: Remove update repository key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/update_repo_key"

  package:
    name: Build launcher and installers
    needs: synchronize
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Configure runner
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install ViGEmBus
        uses: ./.github/actions/install-vigembus

      - name: Verify config version matches release tag
        if: needs.synchronize.outputs.is_release == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:RELEASE_TAG.TrimStart('v')
          $found = Select-String -Path src/config.py -Pattern '^version = "([^"]+)"$'
          if (-not $found) { Write-Error 'src/config.py 中未找到版本号'; exit 1 }
          $configVersion = $found.Matches[0].Groups[1].Value
          if ($configVersion -ne $tagVersion) {
            Write-Error "src/config.py 版本 $configVersion 与发布标签 $tagVersion 不一致"
            exit 1
          }

      - name: Set up Node for native launcher
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Build pinned patched PyAppify launcher
        shell: pwsh
        run: ./tools/launcher/build.ps1 -BuildDir "$env:RUNNER_TEMP/p"

      - name: Build launcher and installers
        uses: ok-oldking/pyappify-action@c5cc8fe5c9bd5c732969018694a2645474c48b7e # master 2026-10-18
        with:
          version: v1.2.3

      - name: Stage release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: 'pyappify_dist/*'
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [synchronize, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: pyappify_dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            ### 下载
            - `ok-zzz-win32-Global-setup.exe`：完整安装包（推荐），已包含运行环境。
            - `ok-zzz-win32-online-setup.exe`：在线安装包，首次启动时下载运行环境。
            - 后台模式需另行安装 [ViGEmBus](https://github.com/nefarius/ViGEmBus/releases) 驱动。
            - 安装后由启动器在线更新，无需重新下载。使用说明见 [README](https://github.com/R0smontis/ok-zzz#readme)。

            ### 更新日志 ${{ needs.synchronize.outputs.start_tag }} -> ${{ needs.synchronize.outputs.end_tag }}
            ${{ needs.synchronize.outputs.changes }}
          draft: false
          prerelease: ${{ needs.synchronize.outputs.is_release != 'true' }}
          files: pyappify_dist/*
