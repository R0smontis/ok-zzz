author: "ok-zzz"
introduction: "使用标准按键与实际就绪状态，不依赖角色专属模板；专属资源和连招由角色模板提供。"
check_dodge_interval: 0.02
check_agent_interval: 0.1
check_chain_interval: 0.02
check_quick_interval: 0.1
auto_lock_interval: -1
auto_turn_interval: 2
scenes:
  - priority: 9
    handlers:
      - states: "[按键可用-普通攻击, 0, 0.25]"
        debug_name: "通用角色操作"
        operations:
          - op_name: "通用战斗"
  - triggers: ["闪避识别-红光", "闪避识别-黄光", "闪避识别-声音"]
    priority: 97
    interval: 0.25
    handlers: []
  - triggers: ["按键可用-快速支援"]
    priority: 97
    interval: 0.25
    handlers: []
  - triggers: ["按键可用-连携技"]
    priority: 98
    interval: 0.5
    handlers: []
