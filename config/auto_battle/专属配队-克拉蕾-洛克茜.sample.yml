author: ok-zzz
thanks: 火
homepage: https://github.com/kawayiYokami/ZenlessZoneZero-OneDragon
version: '20261007'
team_list:
- - 克拉蕾
  - 洛克茜
introduction: 克拉蕾铭刻积痕/长E毁伤，洛克茜长E充能后交棒；第三位沿用原角色规则。适配任意编队顺序。
check_dodge_interval: 0.02
check_agent_interval: 0.1
check_chain_interval: 0.02
check_quick_interval: 0.2
auto_lock_interval: -1
auto_turn_interval: 2
target_lock_interval: 1.0
abnormal_status_interval: 0
scenes:
- triggers:
  - 格挡-破碎
  priority: 98
  interval: 0.3
  handlers:
  - states: '[闪避识别-黄光, 0, 2]'
    debug_name: 画面黑白无法支援
    operations:
    - op_name: 清除状态
      state_list:
      - 自定义-动作不打断
      - 自定义-黄光切人
    - op_name: 等待秒数
      seconds: 0.1
- triggers:
  - 闪避识别-黄光
  - 闪避识别-红光
  - 闪避识别-声音
  priority: 97
  interval: 0.3
  handlers:
  - states: '![自定义-无视闪光, -15, 0]'
    sub_handlers:
    - states: '[闪避识别-黄光, 0, 0.3]'
      sub_handlers:
      - state_template: 支援攻击模板-特殊情况
      - state_template: 双反模板-击破
      - state_template: 双反模板-命破
      - state_template: 双反模板-异常
      - state_template: 双反模板-防护
      - state_template: 双反模板-下一个
    - states: '![自定义-动作不打断, -10, -0.1] & ([闪避识别-红光, 0, 0.3] | [闪避识别-声音, 0, 0.3])'
      sub_handlers:
      - state_template: 闪A模板-全角色
- triggers:
  - 按键可用-连携技
  priority: 98
  interval: 1.5
  handlers:
  - states: ''
    sub_handlers:
    - state_template: 连携模板-通用
- triggers:
  - 连携技-准备
  priority: 97
  interval: 1
  handlers:
  - states: '[连携技-准备]'
    debug_name: 连携技马上要来了
    operations:
    - op_name: 等待秒数
      seconds: 0.1
- triggers:
  - 按键可用-快速支援
  priority: 97
  interval: 0.1
  handlers:
  - state_template: 快速支援模板-全角色
- triggers:
  - 前台-血量扣减
  priority: 90
  handlers:
  - states: '[前台-血量扣减]{1, 100} & ![自定义-动作不打断, 0, 30]'
    sub_handlers:
    - state_template: 轮换-救命-全角色
    - state_template: 闪A模板-全角色
- triggers:
  - 自定义-合轴时间
  priority: 80
  interval: 0.2
  handlers:
  - states: '![自定义-终结技被强制释放, 0, 1]'
    sub_handlers:
    - state_template: 轮换-合轴-全角色
- triggers:
  - 按键可用-切换后援
  priority: 70
  interval: 0.1
  handlers:
  - states: '![自定义-无视闪光, -15, 0]'
    debug_name: 切换后援可用
    operations:
    - op_name: 按键-切换后援-按下
    - op_name: 等待秒数
      seconds: 0.1
    - op_name: 按键-切换后援-松开
    - op_name: 等待秒数
      seconds: 0.1
- triggers: []
  priority: 9
  interval: 0.02
  handlers:
  - states: '![自定义-动作不打断, -10, -0.1] & ![自定义-无视闪光, -15, 0]'
    interrupt_states: '![前台-击破] & ![前台-强攻] & ![前台-支援] & ![前台-防护] & ![前台-异常] & ![前台-命破]
      & ![前台-锋御] & [前台-能量, 0, 0.1]'
    sub_handlers:
    - state_template: 自动锁定模板
    - states: '[自定义-连携换人, 0, 0.5] | [闪避识别-黄光, 0, 0.5] | [闪避识别-红光, 0, 0.5] | [闪避识别-声音,
        0, 0.5]'
      debug_name: 连携-支援
      sub_handlers:
      - state_template: 速切模板-全角色
    - state_template: 轮换-紧急-全角色
    - states: ([按键-切换角色-下一个, 0, 0.1] | [按键-切换角色-上一个, 0, 0.1]) | [自定义-连携跳过, 0, 0.1]
      debug_name: 切人后松开按键
      operations:
      - op_name: 清除状态
        state_list:
        - 自定义-合轴时间
        - 自定义-动作不打断
      - op_name: 按键-普通攻击-松开
      - op_name: 按键-特殊攻击-松开
      - op_name: 按键-移动-前-松开
      - op_name: 按键-移动-后-松开
      - op_name: 按键-移动-左-松开
      - op_name: 按键-移动-右-松开
      - op_name: 按键-闪避-松开
      - op_name: 等待秒数
        seconds: 0.1
  - states: ''
    sub_handlers:
    - state_template: 速切模板-全角色
