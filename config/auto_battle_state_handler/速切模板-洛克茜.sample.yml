template_name: 速切模板-洛克茜
handlers:
- states: '[前台-洛克茜] & [按键可用-普通攻击, 0, 0.25]'
  interrupt_states: '[前台-能量, 0, 0.1] & ![前台-洛克茜]'
  sub_handlers:
  - states: '[自定义-黄光切人, 0, 1]'
    debug_name: 洛克茜支援突击
    operations:
    - op_name: 清除状态
      state: 自定义-黄光切人
    - operation_template: 洛克茜-支援攻击
  - states: '[自定义-红光闪避, 0, 1]'
    debug_name: 洛克茜闪避反击
    sub_handlers:
    - states: '[按键-闪避, 0, 0.5]'
      operations:
      - &id001
        op_name: 清除状态
        state: 自定义-红光闪避
      - &id002
        op_name: 按键-普通攻击
        repeat: 3
        post_delay: 0.15
    - states: ''
      operations:
      - op_name: 按键-闪避
        post_delay: 0.1
      - *id001
      - *id002
  - states: '[自定义-连携换人, 0, 0.5]'
    debug_name: 洛克茜连携后续
    operations:
    - op_name: 清除状态
      state: 自定义-连携换人
    - operation_template: 洛克茜-连携攻击
  - states: '[自定义-自动终结技启用, 0, 0.5] & ([洛克茜-终结技可用, 0, 0.5] & ![自定义-洛克茜-终结技尝试, 0, 3]
      & ([自定义-失衡时间, 0, 8] | [自定义-终结技被强制释放, 0, 1]))'
    debug_name: 洛克茜终结技
    operations:
    - operation_template: 洛克茜-终结技
  - states: '[洛克茜-能量, 0, 0.5]{90, 120} & [洛克茜-特殊技可用, 0, 0.5] & ![自定义-洛克茜-充能尝试, 0,
      5]'
    debug_name: 洛克茜长E充能
    operations:
    - operation_template: 洛克茜-强化特殊技-攒满
  - states: ''
    debug_name: 洛克茜能量不足时交出前台或普攻
    operations:
    - op_name: 设置状态
      state: 自定义-合轴时间
    - operation_template: 洛克茜-普攻连段
