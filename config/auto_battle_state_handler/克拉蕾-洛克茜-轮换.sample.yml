# 只在真实后台角色识别和新鲜能量成立时切入；不凭编队配置猜测头像。
handlers:
  - states: "[按键可用-普通攻击, 0, 0.25]"
    sub_handlers:
      - states: "[前台-洛克茜] & [后台-克拉蕾, 0, 0.5] & ([自定义-洛克茜-出场结束, 0, 3] | [洛克茜-能量, 0, 0.5]{0, 89})"
        debug_name: "洛克茜交棒克拉蕾"
        operations:
          - op_name: "按键-特殊攻击-松开"
          - op_name: "按键-普通攻击-松开"
          - op_name: "按键-切换角色"
            agent_name: "克拉蕾"
          - op_name: "清除状态"
            state_list: ["自定义-合轴时间", "自定义-洛克茜-出场结束"]
      - states: "![前台-洛克茜] & [后台-洛克茜, 0, 0.5] & [洛克茜-能量, 0, 0.5]{90, 120} & ![自定义-洛克茜-充能尝试, 0, 5] & ![自定义-洛克茜-切入尝试, 0, 3] & ![自定义-失衡时间, -10, 8]"
        debug_name: "洛克茜能量足够时切入充能"
        operations:
          - op_name: "设置状态"
            state: "自定义-洛克茜-切入尝试"
          - op_name: "按键-普通攻击-松开"
          - op_name: "按键-特殊攻击-松开"
          - op_name: "按键-切换角色"
            agent_name: "洛克茜"
          - op_name: "清除状态"
            state: "自定义-合轴时间"
