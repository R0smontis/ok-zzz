template_name: 速切模板-克拉蕾
handlers:
- states: '[前台-克拉蕾] & [按键可用-普通攻击, 0, 0.25]'
  interrupt_states: '[前台-能量, 0, 0.1] & ![前台-克拉蕾]'
  sub_handlers:
  - states: '[自定义-黄光切人, 0, 1]'
    debug_name: 克拉蕾支援后续
    operations:
    - op_name: 清除状态
      state: 自定义-黄光切人
    - operation_template: 克拉蕾-支援攻击
  - states: '[自定义-红光闪避, 0, 1]'
    debug_name: 克拉蕾闪避反击
    sub_handlers:
    - states: '[按键-闪避, 0, 0.5]'
      operations:
      - &id001
        op_name: 清除状态
        state: 自定义-红光闪避
      - &id002
        op_name: 按键-普通攻击
        repeat: 3
        post_delay: 0.15
    - states: ''
      operations:
      - op_name: 按键-闪避
        post_delay: 0.1
      - *id001
      - *id002
  - states: '[自定义-连携换人, 0, 0.5]'
    debug_name: 克拉蕾连携后续
    operations:
    - op_name: 清除状态
      state: 自定义-连携换人
    - operation_template: 克拉蕾-连携攻击
  - states: '[自定义-自动终结技启用, 0, 0.5] & ([自定义-终结技被强制释放, 0, 1] & [克拉蕾-终结技可用, 0, 0.5] &
      ![自定义-克拉蕾-终结技尝试, 0, 3])'
    operations:
    - operation_template: 克拉蕾-终结技
  - states: '[克拉蕾-猩红铭刻, 0, 0.8]{5, 100}'
    debug_name: 克拉蕾已核验猩红铭刻
    sub_handlers:
    - states: '[自定义-自动终结技启用, 0, 0.5] & ([克拉蕾-终结技可用, 0, 0.5] & ![自定义-克拉蕾-终结技尝试, 0,
        3])'
      operations:
      - operation_template: 克拉蕾-终结技
    - states: ''
      debug_name: 克拉蕾积痕与长E毁伤循环
      operations:
      - operation_template: 克拉蕾-铭刻循环
  - states: '![克拉蕾-猩红铭刻, 0, 0.8]{5, 100} & [克拉蕾-特殊技可用, 0, 0.5] & ![自定义-克拉蕾-变身尝试, 0,
      1.5]'
    debug_name: 克拉蕾强化特殊技进入铭刻
    operations:
    - operation_template: 克拉蕾-进入猩红铭刻
  - states: ''
    debug_name: 克拉蕾普攻积痕
    operations:
    - operation_template: 克拉蕾-普攻连段
